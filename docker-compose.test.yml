name: locallife-go-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: locallife_test
      MYSQL_USER: locallife
      MYSQL_PASSWORD: locallife_dev
      MYSQL_ROOT_PASSWORD: locallife_test_root
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  test:
    image: golang:1.26.4-bookworm
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      RUN_INTEGRATION: "1"
      MYSQL_ADDR: mysql:3306
      MYSQL_DATABASE: locallife_test
      MYSQL_USER: locallife
      MYSQL_PASSWORD: locallife_dev
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CGO_ENABLED: "1"
      GOCACHE: /go/build-cache
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/build-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["go", "test", "-race", "./...", "-count=1"]
volumes:
  go-mod-cache:
  go-build-cache:
